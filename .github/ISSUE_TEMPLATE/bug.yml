name: Bug report
description: Report a reproducible non-security bug
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include real credentials, phone numbers, or message contents here. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Twilio, Telnyx, Vonage, Plivo, Generic HMAC, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
